<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Regula · Regulatory Change Impact Agent</title>
<meta name="description" content="Track regulatory change, assess policy, process and system impact, and produce an audit-ready change plan." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1a2b'/%3E%3Cpath d='M9 23V9h7.4c3.1 0 5.1 1.8 5.1 4.6 0 2.2-1.3 3.8-3.5 4.3L23 23h-3.9l-4-4.4H12V23z' fill='%232fd08b'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <aside class="rail" id="rail">
    <a class="brand" href="#/inbox" aria-label="Regula home">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#132a40"/><path d="M9 23V9h7.4c3.1 0 5.1 1.8 5.1 4.6 0 2.2-1.3 3.8-3.5 4.3L23 23h-3.9l-4-4.4H12V23z" fill="#2fd08b"/></svg>
      </span>
      <span class="brand-text"><b>regula</b><i>by Azentio Bank</i></span>
    </a>

    <div class="rail-label">Workspace</div>
    <div class="workspace">
      <span class="ws-mark">AB</span>
      <span><b>Azentio Bank</b><i>India · RBI / SEBI</i></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></svg>
    </div>

    <nav class="nav" aria-label="Primary">
      <a href="#/inbox" data-nav="inbox"><svg viewBox="0 0 24 24"><path d="M3.5 6.5h17v13h-17z"/><path d="M3.5 13h4.6l1.8 2.6h4.2l1.8-2.6h4.6"/></svg><span>Inbox</span><em id="nav-count">3</em></a>
      <a href="#/graph" data-nav="graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="8" r="2.2"/><circle cx="9" cy="18" r="2.2"/><circle cx="19" cy="17" r="2.2"/><path d="M8 7l8 .8M7.2 8l1.2 8M11 17.6l6-.4M16.4 9.4l1.9 5.6"/></svg><span>Impact graph</span></a>
      <a href="#/plan" data-nav="plan"><svg viewBox="0 0 24 24"><path d="M4 5h5v14H4zM10 5h5v9h-5zM16 5h4v6h-4z"/></svg><span>Change plan</span><em id="nav-plan">25</em></a>
      <a href="#/audit" data-nav="audit"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-2.9 7.6-7 9-4.1-1.4-7-4.6-7-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg><span>Audit trail</span></a>
    </nav>

    <div class="rail-label">Coverage</div>
    <div class="rail-stat">
      <div class="ring" style="--p:100"><span>100<small>%</small></span></div>
      <div><b>Evidence linked</b><i>Every obligation traced to an owner</i></div>
    </div>

    <div class="rail-foot">
      <div class="agent-pill"><span class="pulse"></span> Agent online <i>deterministic</i></div>
      <p>v1.0.0 · demo build<br/>No external model required.</p>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <label class="search" id="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <input id="search" type="search" placeholder="Search circulars, assets, owners" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <span class="mode-chip"><span class="dot"></span> Deterministic run</span>
        <button class="btn btn-primary" id="run-btn"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg> Run agent</button>
        <button class="avatar" id="avatar" title="Priya Menon · Head of Compliance">PM</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>
  <div class="modal-wrap" id="modal-wrap" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
